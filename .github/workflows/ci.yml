# Typecheck, lint, unit and integration tests, then the production build Render runs.
# Integration tests run against a disposable postgres service container, never Neon. No step calls a
# paid model: the model is faked at the HTTP boundary.
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # A plausible app configuration, as a developer's shell may export, so the suite proves that
      # tests/support/hermetic-env.ts keeps it away from every test. Nothing here is reachable or real.
      - run: npm run test:unit
        env: &app-config
          DATABASE_URL: postgres://ci@db.invalid:5432/backfill
          META_API_KEY: ci-not-a-key
          META_BASE_URL: https://api.meta.ai/v1
          META_MODEL_SPARK: muse-spark-1.3
          META_MODEL_WONDER: muse-wonder-1.0
      - run: npm run test:integration
        env: *app-config
      - run: npm run build
