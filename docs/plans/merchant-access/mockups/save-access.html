<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Save workspace access · design preview</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#faf7ef;color:#17152d;font:16px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace}header,main,footer{max-width:1000px;margin:auto;padding:26px}header{border-bottom:1px solid #ddd7ca;letter-spacing:3px}main{padding-top:60px;padding-bottom:70px}h1{font-size:clamp(30px,5vw,48px);line-height:1.2}p{max-width:680px}.muted{color:#635e72}.preview{font-size:13px;color:#635e72}section{border-block:1px solid #ccc5b7;padding:20px 0;margin:30px 0;max-width:760px}label{display:block;margin-bottom:8px}input{font:inherit;color:inherit;width:100%;border:1px solid #aaa492;padding:14px;background:#fffdf8}button,a{font:inherit;display:inline-block;text-decoration:none;padding:12px 18px;border:1px solid #aaa492;background:transparent;color:inherit;margin:16px 8px 0 0;cursor:pointer}.primary{background:#3b4fff;border-color:#3b4fff;color:white}.note{font-size:13px}footer{border-top:1px solid #ddd7ca;font-size:13px}
</style>
<header><strong>BACKFILL</strong></header>
<main>
  <p class="preview">Design preview · this is a fake example link</p>
  <p class="muted">Your workspace is ready</p>
  <h1>Save your way back in.</h1>
  <p>Keep this link to return on any device.</p>
  <section><label for="access">Your private access link</label><input id="access" readonly value="https://backfill.example/merchant/enter#EXAMPLE-ONLY"><button type="button" onclick="document.getElementById('status').textContent='Preview only. No link copied.'">Copy access link</button><button type="button" onclick="document.getElementById('status').textContent='Preview only. No download started.'">Download access link</button><p class="note muted">Keep it private. Anyone with it can manage your workspace. Lost links can't be recovered.</p><p role="status" id="status" class="note"></p></section>
  <button class="primary" type="button" onclick="document.getElementById('status').textContent='Preview only. No workspace opened.'">Continue to my workspace →</button><a href="access.html">Back to entry preview</a>
</main>
<footer>Backfill · Singapore</footer>
</html>
