<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Backfill · Kopi site review</title><style>body{margin:0;background:#fbf7ee;color:#15142b;font:14px/1.7 monospace}header,main{max-width:1280px;margin:auto;padding:28px}header{position:sticky;top:0;background:#fbf7ee;z-index:2;border-bottom:1px solid #e6e0d2}h1{font-size:23px;margin:0}p{margin:8px 0}nav{display:flex;gap:12px;flex-wrap:wrap}a,button{font:inherit;color:inherit}button{padding:7px 13px;border:1px solid #15142b;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#2f55f4;color:white;border-color:#2f55f4}section{margin:25px 0 60px;scroll-margin-top:220px}img{display:block;max-width:100%;height:auto;border:1px solid #e6e0d2;margin:auto}.note{color:#5f5d72;font-size:12px}.controls{margin:14px 0}h2{font-size:19px}a{color:#2f55f4}</style></head><body><header><h1>Backfill / Kopi site review</h1><p><a href="http://127.0.0.1:3190/" target="_blank" rel="noopener">Open the working site ↗</a></p><p class="note">Local synthetic data only. These screenshots do not represent new bookings or model runs. Slice 9 has not started.</p><div class="controls"><button aria-pressed="true" data-width="1280">Desktop</button> <button aria-pressed="false" data-width="375">Mobile</button></div><nav><a href="#landing">Landing</a><a href="#demo">Demo</a><a href="#merchant-signed-in">Merchant</a><a href="#draft">Menu review</a><a href="#evals">Evals</a><a href="#system">Diagnostics</a><a href="#merchant">Merchant entry</a></nav></header><main id="screens"></main><script>const screens=[['landing','Landing page'],['demo','Stored demo'],['merchant-signed-in','Merchant workspace'],['draft','Review menu and terms'],['evals','Evaluation results pending'],['system','System diagnostics'],['merchant','Merchant entry']];document.querySelector('#screens').innerHTML=screens.map(([id,title])=>`<section id="${id}"><h2>${title}</h2><img src="${id}-1280.png" alt="${title}, desktop" loading="lazy" data-screen="${id}"></section>`).join('');document.querySelectorAll('[data-width]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-width]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelectorAll('img').forEach(i=>{i.src=i.dataset.screen+'-'+b.dataset.width+'.png';i.alt=i.closest('section').querySelector('h2').textContent+', '+(b.dataset.width==='375'?'mobile':'desktop');});});</script></body></html>
